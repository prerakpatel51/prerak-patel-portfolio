services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: prerak-portfolio:local
    init: true
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: "local-docker-portfolio-key-change-before-public-deployment"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,[::1]"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
